# Monthly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so they are easy to review; major bumps come one at a time.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: monthly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly

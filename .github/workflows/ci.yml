name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: api
      - run: ruff check .
        working-directory: api
      - run: ruff format --check .
        working-directory: api
      - run: mypy
        working-directory: api
      - run: pytest -q
        working-directory: api

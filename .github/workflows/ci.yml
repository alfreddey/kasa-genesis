name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Works out which apps a PR touches, so a web-only change skips the API job
  # and the other way round. Pushes to main always run everything.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ github.event_name == 'push' || steps.filter.outputs.api == 'true' }}
      web: ${{ github.event_name == 'push' || steps.filter.outputs.web == 'true' }}
      docker: ${{ github.event_name == 'push' || steps.filter.outputs.docker == 'true' }}
      docs: ${{ github.event_name == 'push' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'stories/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/openapi.json'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '**/.env.example'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            # Images only need a rebuild check when how they are built changes.
            docker:
              - 'api/Dockerfile'
              - 'api/Dockerfile.dockerignore'
              - 'api/pyproject.toml'
              - 'web/Dockerfile'
              - 'web/.dockerignore'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  api:
    name: API - lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest with coverage (fake synthesizer, no model download)
        run: pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=markdown:coverage.md
      - name: Show coverage on the run summary
        if: always()
        run: test -f coverage.md && cat coverage.md >> "$GITHUB_STEP_SUMMARY" || true

  # Docs must match the repo: paths, make targets and settings they mention must exist (#28).
  docs:
    name: Docs - match the repo
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
      - run: pip install pytest && pytest -q scripts

  web:
    name: Web - lint, types, tests, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: API types match api/openapi.json
        run: npm run check:api
      - name: Typecheck
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Real-browser tests on a phone-sized Chromium (#51). The API is stubbed in the browser, so
  # no API or model is needed. Traces are kept only when a failed test is retried.
  e2e:
    name: Web - browser tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (Playwright)
        run: npm run e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  # Builds both images to prove the Dockerfiles work. Nothing is pushed.
  docker:
    name: Docker - build ${{ matrix.image }} image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: api/Dockerfile
            # Skip PyTorch so the build stays fast; the TTS layer is not what CI guards.
            build-args: INSTALL_TTS=false
          - image: web
            context: web
            file: web/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=/
              API_INTERNAL_URL=http://api:8000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: Docker - validate compose file
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  # The one check to mark as required in branch protection. It passes when every
  # job above passed or was skipped by the path filter, and fails otherwise.
  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, api, docs, web, e2e, docker, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A CI job finished with '$r'."
              exit 1
            fi
          done

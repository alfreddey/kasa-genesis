name: New story or language
description: Add a story, or a new language to read stories in.
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What are you adding?
      options:
        - A story
        - A language
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      description: Name and ISO 639-3 code, for example Twi (aka), Ewe (ewe), Ga (gaa).
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Story title
      description: Leave empty if you are adding a language.
  - type: textarea
    id: source
    attributes:
      label: Source and permission
      description: Where the text (or voice data) comes from, its licence, and whether we may use it.
    validations:
      required: true
  - type: textarea
    id: speaker
    attributes:
      label: Checking the text
      description: Who can check spelling and pronunciation as a native speaker?

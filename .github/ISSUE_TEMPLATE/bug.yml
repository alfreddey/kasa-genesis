name: Bug
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make dev
        2. Pick "Ewe greetings"
        3. Press Read aloud
  - type: input
    id: where
    attributes:
      label: Where
      description: Browser and device, or OS and Python version, and the voice (KASA_VOICE).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text

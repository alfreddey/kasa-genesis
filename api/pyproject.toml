[project]
name = "kasa-genesis"
version = "0.1.0"
description = "Read stories written in Ghanaian local languages aloud with text-to-speech."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
# The real speech model. Large download (PyTorch), so it is optional for tests and CI.
tts = [
  "torch>=2.1",
  "transformers>=4.40",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kasa"]

[tool.setuptools.package-data]
kasa = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "kasa-genesis"
version = "0.1.0"
description = "Read stories written in Ghanaian local languages aloud with text-to-speech."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# The real speech model. Large download (PyTorch), so it is optional for tests and CI.
tts = [
  "torch>=2.1",
  "transformers>=4.40",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kasa"]

[tool.setuptools.package-data]
kasa = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Query(...) defaults are the documented style.
ignore = ["B008", "E501"]  # E501: the formatter wraps code; long strings are fine

[tool.mypy]
python_version = "3.12"
packages = ["kasa"]
strict = true
# Tests and experiments are checked loosely; the kasa package is strict.

[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true
